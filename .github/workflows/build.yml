name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      artifact_serial:
        description: Artifact serial for the pinned Wine version
        type: string
        default: '2'
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      attestations: write
      id-token: write
    with:
      artifact_serial: ${{ inputs.artifact_serial || '2' }}
      attest: ${{ github.event_name != 'pull_request' }}
